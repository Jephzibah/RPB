<!DOCTYPE html>
<html lang="en">
<head>
	<include src="partials/head.html" title="Your orders" noindex="1"></include>
</head>
<body>
	<include src="partials/header.html"></include>

	<main id="main-content" tabindex="-1">
		<section id="orders">
			<div class="container" data-orders>
				<h1>Your orders</h1>
				<noscript><p>Your orders need JavaScript. You can also reply to your order confirmation email and we'll help.</p></noscript>

				<p data-orders-signed-out hidden>Please <a href="/login">log in</a> to see your orders.</p>
				<p class="form__status" role="status" data-orders-status></p>

				<div class="orders__results" data-orders-results hidden>
					<p class="orders__signed-in"><span data-orders-email></span> <button class="link-button" type="button" data-orders-logout>Sign out</button></p>
					<p data-orders-empty hidden>There are no orders for this email yet.</p>
					<ol class="orders__list" data-orders-list></ol>
				</div>
			</div>
		</section>
	</main>

	<include src="partials/footer.html"></include>
</body>
</html>
