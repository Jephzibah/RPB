<!-- Expects a `product` from <each in="catalog.products" as="product"> -->
<article class="product" id="product-{{ product.id }}">
	<div class="product__image">
		<img src="{{ product.image }}" alt="{{ product.name }}" sizes="(min-width: 768px) 33vw, 100vw">
	</div>
	<div class="product__body">
		<h2 class="product__name">{{ product.name }}</h2>
		<p class="product__description">{{ product.description }}</p>
		<p class="product__price">{{ product.priceDisplay }}</p>
		<button class="btn" type="button"
			data-add-to-cart="{{ product.id }}"
			data-name="{{ product.name }}"
			data-price="{{ product.price }}">Add to cart</button>
	</div>
</article>
