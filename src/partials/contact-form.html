<!--
	Posts to the Worker at /api/contact (worker/lib/contact.js).
	Spam protection: Cloudflare Turnstile + a hidden honeypot field.
-->
<form id="contact-form" class="form" action="/api/contact" method="post" novalidate>
	<div class="form__field">
		<label for="cf-name">Name</label>
		<input id="cf-name" name="name" type="text" autocomplete="name" required maxlength="100">
	</div>
	<div class="form__field">
		<label for="cf-email">Email</label>
		<input id="cf-email" name="email" type="email" autocomplete="email" required maxlength="200">
	</div>
	<div class="form__field">
		<label for="cf-phone">Phone <span class="form__optional">(optional)</span></label>
		<input id="cf-phone" name="phone" type="tel" autocomplete="tel" maxlength="40">
	</div>
	<div class="form__field">
		<label for="cf-subject">Subject</label>
		<input id="cf-subject" name="subject" type="text" required maxlength="150">
	</div>
	<div class="form__field form__field--full">
		<label for="cf-message">Message</label>
		<textarea id="cf-message" name="message" rows="6" required maxlength="5000"></textarea>
	</div>
	<div class="form__honeypot" aria-hidden="true">
		<label for="cf-website">Leave this field empty</label>
		<input id="cf-website" name="company_website" type="text" tabindex="-1" autocomplete="off">
	</div>
	<div class="form__field form__field--full">
		<div class="cf-turnstile" data-sitekey="{{ site.turnstile.siteKey }}"></div>
	</div>
	<div class="form__field form__field--full">
		<button class="btn" type="submit">Send message</button>
		<p class="form__status" role="status" data-form-status></p>
	</div>
</form>
