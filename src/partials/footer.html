<footer id="site-footer">
	<div class="band band--dark">
		<div class="container footer">
			<p class="footer__brand">{{ site.name }}</p>
			<nav aria-label="Footer">
				<ul class="footer__links">{{ nav }}<if feature="shop"><li><a href="/orders">Your orders</a></li></if></ul>
			</nav>
			<p class="footer__legal">&copy; {{ year }} {{ site.name }}. All rights reserved.<if set="site.iconCredit"> Icons by <a href="https://fontawesome.com">Font Awesome</a>.</if></p>
		</div>
	</div>
	<p class="footer__made-by"><span>Of course</span> we made this.</p>
</footer>
