<!DOCTYPE html>
<html lang="en">
<head>
	<include src="partials/head.html" title="Cart" noindex="1"></include>
</head>
<body>
	<include src="partials/header.html"></include>

	<main id="main-content" tabindex="-1">
		<section id="cart">
			<div class="container">
				<h1>Your cart</h1>
				<div class="cart" data-cart>
					<p data-cart-empty>Your cart is empty. <a href="/shop">Continue shopping</a>.</p>
					<table class="cart__table" data-cart-table hidden>
						<caption class="visually-hidden">Items in your cart</caption>
						<thead><tr><th scope="col">Item</th><th scope="col">Qty</th><th scope="col">Price</th><th scope="col"><span class="visually-hidden">Remove</span></th></tr></thead>
						<tbody data-cart-lines></tbody>
						<tfoot><tr><th scope="row" colspan="2">Subtotal</th><td data-cart-total></td><td></td></tr></tfoot>
					</table>
					<div class="cart__checkout" data-cart-checkout hidden>
						<p class="cart__note">Shipping and taxes are calculated at checkout.</p>
						<if feature="stripe"><button class="btn" type="button" data-checkout="stripe">Checkout with card</button></if>
						<if feature="paypal"><div class="cart__paypal" data-paypal-buttons></div></if>
						<p class="form__status" role="status" data-checkout-status></p>
					</div>
				</div>
			</div>
		</section>
	</main>

	<include src="partials/footer.html"></include>
</body>
</html>
